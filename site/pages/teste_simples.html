<!DOCTYPE html>
<html>
<head>
    <title>Teste Simples - Lookup Empresa</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        input { padding: 8px; width: 200px; }
        button { padding: 8px 15px; cursor: pointer; }
        .output { background: #f5f5f5; padding: 10px; margin-top: 10px; white-space: pre-wrap; font-family: monospace; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Teste Simples: Lookup Empresa por NIF</h1>

    <div>
        <label>NIF:</label>
        <input type="text" id="nif" placeholder="503789372" maxlength="9">
        <button onclick="testar()">Testar</button>
    </div>

    <div id="output" class="output"></div>

    <script>
        function testar() {
            const nif = document.getElementById('nif').value.trim();
            const output = document.getElementById('output');

            if (!nif) {
                output.innerHTML = '<span class="error">❌ Digite um NIF</span>';
                return;
            }

            output.innerHTML = `🔍 Procurando empresa para NIF: ${nif}\n`;

            fetch(`get_company_by_nif.php?nif=${encodeURIComponent(nif)}`)
                .then(res => {
                    output.innerHTML += `📡 HTTP ${res.status}\n`;
                    return res.json();
                })
                .then(json => {
                    output.innerHTML += `📋 Dados: ${JSON.stringify(json, null, 2)}\n`;

                    if (json.found && json.nome_empresa) {
                        output.innerHTML += `<span class="success">✅ Empresa: ${json.nome_empresa}</span>`;
                    } else {
                        output.innerHTML += `<span class="error">❌ Empresa não encontrada</span>`;
                    }
                })
                .catch(err => {
                    output.innerHTML += `<span class="error">❌ Erro: ${err.message}</span>`;
                });
        }

        // Teste automático
        document.getElementById('nif').value = '503789372';
    </script>
</body>
</html>
